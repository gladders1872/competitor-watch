# Competitor Watch configuration
# Edit this file on GitHub (pencil icon), then "Commit changes".
# The next daily scan picks up your changes automatically.

settings:
  # How many new or changed pages per competitor to open and read per scan
  # (title, H1, H2s, meta description). Keeps scans polite and fast.
  max_pages_to_read_per_competitor: 60
  # Pause between page requests, in seconds
  request_delay: 0.6
  # How many days of changes to keep in the dashboard
  keep_days: 180
  # AI brief (optional). Needs an ANTHROPIC_API_KEY secret in the repo.
  ai_brief: true
  ai_model: claude-sonnet-5

# Paths ignored for EVERY client and competitor.
# Pattern rules:
#   /careers/         anything starting with that path
#   */tag/*           "*" means "anything", so this catches /blog/tag/x too
#   regex:^/(de|fr)/  a regular expression, for advanced use
global_exclude:
  - /careers/
  - /jobs/
  - /job/
  - /privacy
  - /terms
  - /cookie
  - /legal/
  - /login
  - /search
  - /wp-content/
  - "*/tag/*"
  - "*/author/*"
  - "*/page/*"
  - "*/feed/"
  # Non-English versions of sites (drop any line you want to keep)
  - regex:^/(de|fr|es|it|nl|pt|pt-br|ja|jp|zh|ko|he|pl|sv|da|no|fi)(/|$)

# How pages are sorted into asset types. First match wins, top to bottom.
# "paths" are matched against the URL path, "words" against the page title.
asset_types:
  - name: Webinar
    paths: [/webinar, /webinars/, /on-demand, /ondemand]
    words: [webinar, on-demand, fireside chat, live session]
  - name: Whitepaper / eBook
    paths: [/whitepaper, /white-paper, /ebook, /e-book, /guide, /guides/, /report, /reports/, /research/]
    words: [whitepaper, white paper, ebook, e-book, guide, report, playbook, benchmark]
  - name: Case study
    paths: [/case-stud, /customer-stor, /customers/, /success-stor]
    words: [case study, customer story, success story]
  - name: Podcast / Video
    paths: [/podcast, /video, /videos/, /episode]
    words: [podcast, episode, video]
  - name: Event
    paths: [/event, /events/, /conference]
    words: [event, conference, summit, meet us at, join us at]
  - name: News / Press
    paths: [/news, /press, /media/, /newsroom, /announcement]
    words: [announces, press release, partners with, launches, raises, appoints]
  - name: Glossary / Knowledge
    paths: [/glossary, /faq, /what-is, /learn/, /academy, /knowledge]
    words: [what is, glossary, definition]
  - name: Blog
    paths: [/blog, /insights, /articles/, /article/, /post/, /posts/, /perspectives]
    words: []
  - name: Product / Solution
    paths: [/product, /platform, /solution, /use-case, /features, /capabilities, /lines-of-business, /claims-, /integrations, /partners]
    words: []
  - name: Company page
    paths: [/about, /company, /team, /leadership, /contact, /pricing, /demo]
    words: []
  # Anything not matched above is shown as "Other"

clients:
  - id: five-sigma
    name: Five Sigma
    site: fivesigmalabs.com

    # Keyword alerts. Each group gets its own alert when a competitor adds,
    # removes or changes a page that mentions any of its terms.
    # Terms are matched in the URL, page title, H1 and H2 headings.
    # Matching ignores capitals, and hyphens in URLs count as spaces.
    keywords:
      - group: Five Sigma and Clive mentions
        terms: [five sigma, 5sigma, fivesigma, clive ai, clive]
      - group: Claims management platform
        terms: [claims management system, claims management software, claims management solution, claims management platform, claims management service, claim management system, claim management software, claim management solution, claims platform, claims solution, claims processing platform, claims administration, claims tracking, enterprise claims, insurance management solution]
      - group: P&C claims
        terms: [p&c, property and casualty, property & casualty, p and c]
      - group: Property and home claims
        terms: [property claims, property claim, property insurance claims, home insurance claims, home claims, home claim, high volume claims, high-volume claims]
      - group: Workers comp
        terms: [workers comp, workers compensation, "workers' comp", "workers' compensation", "workers’ comp", "workers’ compensation", work comp, injury claims]
      - group: Liability claims
        terms: [liability claims, liability claim]
      - group: Claims automation
        terms: [claims automation, claim automation, automated claims, automated claim, automate claims, automating claims, automated insurance claims, claims workflow automation, workflow automation, claims processing automation, straight through processing, touchless claims]
      - group: Intake and triage
        terms: [claim intake, claims intake, fnol, first notice of loss, triage]
      - group: AI claims agents and assistants
        terms: [ai claims, ai claim, claims ai, ai agent, ai assistant, claims assistant, claims agent, agentic, ai powered claims, ai-powered claims, ai driven claims, ai-driven claims]
      - group: Decision support and analytics
        terms: [decision support, predictive analytics, claims analytics, claims data, claims insights, data insights, insurance reporting]
      - group: Document AI and NLP
        terms: [document classification, document ai, intelligent document processing, natural language processing, nlp]
      - group: Cycle time and leakage
        terms: [cycle time, turnaround time, claims handling, claim leakage, claims leakage, leakage, claims efficiency]
      - group: Cloud and legacy integration
        terms: [cloud based claims, cloud-based claims, cloud claims, saas claims, legacy system, legacy systems, core system, rip and replace, guidewire, duck creek]
      - group: Omnichannel communication
        terms: [omnichannel, omni-channel, claimant communication, policyholder communication, customer communication]
      - group: Security and compliance
        terms: [compliance, compliant, soc 2, soc2, data security, regulatory]
      - group: Digital claims
        terms: [digital claims, digital insurance, digital property insurance, digital claims processing, claims digitization, claims digitalization]

    # Paths ignored for this client only (on top of global_exclude)
    exclude: []

    competitors:
      - domain: assured.com
      - domain: federato.ai
      - domain: himarley.com
      - domain: snapsheetclaims.com
      - domain: tractable.ai
      - domain: bevaya.ai
      - domain: sprout.ai
      - domain: shift-technology.com
      - domain: agentech.com
      - domain: claraanalytics.com
      - domain: charlee.ai
      - domain: docosoft.com
      - domain: wilbur.io
      - domain: omnius.com
      - domain: cccis.com
        # CCC is a very large site. Add paths here to ignore sections that
        # are not relevant to Five Sigma, for example:
        # exclude:
        #   - /repair-facilities/
        #   - /parts/
        exclude: []

      # Optional per competitor settings:
      #   name: Display name (defaults to the domain)
      #   sitemaps: [https://example.com/sitemap.xml]   if auto discovery fails
      #   exclude: [/some-section/]

  - id: chargeafter
    name: ChargeAfter
    site: chargeafter.com

    keywords:
      - group: Point of sale financing
        terms: [point of sale financing, pos financing, pos lending, checkout financing, point of sale lending]
      - group: Buy now pay later
        terms: [buy now pay later, bnpl, pay over time, pay in 4, installment, installments]
      - group: Multi-lender platform
        terms: [multi lender, multi-lender, lender network, waterfall, second look, full spectrum, prime, near prime, subprime]
      - group: Embedded finance
        terms: [embedded finance, embedded lending, embedded financing, financing api]
      - group: Consumer financing
        terms: [consumer financing, consumer finance, customer financing, retail financing, merchant financing]
      - group: Home improvement and contractors
        terms: [home improvement, contractor, contractors, hvac, roofing, solar, remodeling]
      - group: Lease to own
        terms: [lease to own, rent to own, lease purchase]
      - group: Private label and cards
        terms: [private label, credit card, card linked, virtual card]
      - group: Lenders and banks
        terms: [lender, lenders, bank, banks, credit union, issuer]

    exclude: []

    competitors:
      - domain: versatilecredit.com
      - domain: skeps.com
      - domain: jifiti.com
      - domain: finmkt.io
      - domain: oneclickcontractor.com
